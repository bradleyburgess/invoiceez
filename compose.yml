services:
  frontend:
    image: ghcr.io/bradleyburgess/invoiceez_frontend
    container_name: invoiceez_frontend
    expose:
      - "80"
    networks:
      - invoiceez_network

  backend:
    image: ghcr.io/bradleyburgess/invoiceez_backend
    container_name: invoiceez_backend
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_PRINT_TELEMETRY_DETAILS=false
    expose:
      - "5000"
    networks:
      - invoiceez_network
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    container_name: invoiceez_postgres
    volumes:
      - invoiceez_postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    env_file:
      - ./.env
    networks:
      - invoiceez_network

volumes:
  invoiceez_postgres:

networks:
  invoiceez_network:
    external: true
    name: ${DOCKER_NETWORK}
